name: Quarterly Self-Optimization

on:
  schedule:
    # First day of every quarter at midnight UTC
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    name: Quarterly Engine Optimization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quarterly optimization analysis
        run: node scripts/quarterly-optimize.js
        env:
          NODE_ENV: production

      - name: Check for recommendations
        id: check
        run: |
          if [ -f ops/quarterly-recommendations.json ]; then
            PROPOSALS=$(node -e "const r=require('./ops/quarterly-recommendations.json'); console.log(r.proposals.length)")
            echo "proposals=$PROPOSALS" >> $GITHUB_OUTPUT
            echo "Generated $PROPOSALS proposals"
          fi

      - name: Commit recommendations
        if: github.event.inputs.dry_run != 'true' && steps.check.outputs.proposals != '0'
        run: |
          git config user.name "FreedomForge Optimizer"
          git config user.email "optimizer@freedomforge.one"
          git add ops/quarterly-recommendations.json
          git diff --staged --quiet || git commit -m "chore: quarterly self-optimization report $(date +%Y-Q%q)"
          git push

      - name: Create summary
        run: |
          echo "## Quarterly Optimization Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Proposals: ${{ steps.check.outputs.proposals }}" >> $GITHUB_STEP_SUMMARY
          echo "- Report: \`ops/quarterly-recommendations.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- Next run: First day of next quarter" >> $GITHUB_STEP_SUMMARY
